<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>《東方快車謀殺案》國文教學資源包</title>
  <style>
    :root {
      --bg: #fff8fc; --bg2: #f8f2ff; --card: #ffffff; --ink: #4b4154; --muted: #7d7188;
      --pink: #ff86b7; --pink-deep: #ff5ea1; --lav: #b78dff; --lav-deep: #8e69e8;
      --soft: #ffeaf4; --soft2: #f3edff; --line: #ecdaf6; --gold: #c79a56;
      --shadow: 0 12px 30px rgba(155, 112, 185, .14); --radius: 24px; --radius-sm: 16px; --maxw: 1180px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top left, #fff0f7 0%, transparent 28%), 
                  radial-gradient(circle at top right, #f3ecff 0%, transparent 28%), 
                  linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--ink); line-height: 1.8;
    }
    a { color: #8f5fe8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, h4 { color: #5d436b; margin-top: 0; }
    
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 28px 18px 80px; }
    .topbar { margin-bottom: 18px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; 
      border-radius: 999px; background: rgba(255,255,255,.92); border: 1px solid var(--line); 
      box-shadow: var(--shadow); color: var(--lav-deep); font-weight: 700; font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .back-link:hover {
      text-decoration: none;
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(155, 112, 185, .2);
    }
    
    /* Hero Section */
    .hero {
      position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,240,248,.92) 50%, rgba(243,237,255,.94));
      border: 1px solid #f0dcec; border-radius: 32px; box-shadow: var(--shadow); 
      padding: 34px 28px 30px; margin-bottom: 24px;
    }
    .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; filter: blur(8px); opacity: .45; }
    .hero::before { width: 180px; height: 180px; background: #ffd9e9; right: -40px; top: -50px; }
    .hero::after { width: 180px; height: 180px; background: #e7dcff; left: -40px; bottom: -60px; }
    .eyebrow {
      display: inline-block; margin-bottom: 12px; padding: 7px 12px; border-radius: 999px;
      background: linear-gradient(90deg, #ffe8f2, #f2ebff); color: var(--pink-deep); 
      font-size: 13px; font-weight: 800; letter-spacing: .5px; position: relative; z-index: 1;
    }
    .hero h1 { position: relative; z-index: 1; margin: 0 0 10px; font-size: clamp(30px,4vw,42px); line-height: 1.22; }
    .hero-desc { position: relative; z-index: 1; margin: 0; font-size: 16px; color: var(--muted); max-width: 900px; }
    .badge-row { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .badge {
      background: #fff; border: 1px solid var(--pink); color: var(--pink-deep);
      padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: bold;
    }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
